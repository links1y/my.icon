<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Amoula 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p3:#c2336f;--ink:#6a1f41}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#ffe4ee;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink)}
.stage{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#fff5f9,#ffd3e5 55%,#ffb8d3)}

/* ONE frame: video behind, message in front */
.frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.95);width:min(620px,92vw);height:min(86vh,820px);height:min(86dvh,820px);border-radius:30px;overflow:hidden;background:#ffdceb;box-shadow:0 0 0 3px #fff,0 0 0 7px #ffc2da,0 24px 56px rgba(214,64,124,.38);opacity:0;visibility:hidden;transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.9,.3,1)}
.frame.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,244,249,.25),rgba(255,240,247,.62) 45%,rgba(255,236,245,.75))}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:26px 26px 34px;text-align:center;scrollbar-width:thin;scrollbar-color:#ff8fb8 transparent}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:linear-gradient(#ffa3c6,#e0407f);border-radius:8px}
.scroll::-webkit-scrollbar-track{margin:24px 0}

.photo{position:relative;width:112px;height:112px;margin:6px auto 18px}
.photo:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#fff,#ff8fb8,#fff,#ffc2da,#e0407f,#fff);animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.photo img{position:relative;z-index:2;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;display:block}
.photo b{position:absolute;z-index:3;top:-24px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:1.7rem}

.rv{opacity:0}
.frame.show .rv{animation:rise2 .9s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(.7s + var(--i)*.25s)}
@keyframes rise2{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-220% 0}}
.frame h2{font-family:'Playfair Display',serif;font-size:clamp(2.1rem,8vw,2.9rem);background:linear-gradient(100deg,#c2336f 25%,#ff7fb0 50%,#c2336f 75%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 0 6px #fff)}
.sub{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1rem,3.8vw,1.2rem);color:#d6336f;margin:4px 0 14px;text-shadow:0 0 8px #fff}
.div{width:150px;height:2px;margin:0 auto 20px;background:linear-gradient(90deg,transparent,#ff6fa5,transparent);position:relative}
.div:after{content:"♡";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:0 8px;color:#ff4f93;text-shadow:0 0 8px #fff}
.msg{font-size:clamp(1rem,3.5vw,1.1rem);line-height:1.95;font-weight:600;color:var(--ink);max-width:520px;margin:0 auto;text-shadow:0 0 6px #fff,0 0 12px #fff}
.sig{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:clamp(1.3rem,4.8vw,1.6rem);color:var(--p3);margin-top:22px;text-shadow:0 0 8px #fff,0 0 14px #fff}

/* intro */
.intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;padding:24px;overflow:hidden;background:radial-gradient(circle at 20% 10%,#fffafc,#ffdcea 50%,#ffb6d2);transition:opacity 1s ease,visibility 1s}
.intro.hide{opacity:0;visibility:hidden}
.intro:before,.intro:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);animation:drift 9s ease-in-out infinite}
.intro:before{top:-120px;left:-120px}
.intro:after{bottom:-140px;right:-120px;animation-delay:-4s;background:radial-gradient(circle,rgba(255,120,175,.45),transparent 70%)}
@keyframes drift{50%{transform:translate(40px,30px) scale(1.15)}}
.intro>*{position:relative;z-index:1}
.bow{font-size:clamp(2.6rem,9vw,3.6rem);filter:drop-shadow(0 6px 14px rgba(224,64,127,.45));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.intro h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.9rem,6.4vw,3.3rem);line-height:1.2;background:linear-gradient(100deg,#c2336f 20%,#ff7fb0 45%,#c2336f 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine
