<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050608" />
  <title>Pull the Cord</title>

  <style>
    :root {
      --bg: #050608;
      --warm: #ffd77a;
      --pink: #ff4770;
      --text: #f8f8f8;
      --muted: rgba(255, 255, 255, 0.58);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      user-select: none;
      touch-action: none;
      transition: background 1.2s ease;
    }

    body.lit {
      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(255, 206, 112, 0.15),
          transparent 27%
        ),
        linear-gradient(180deg, #17120d 0%, #08090d 72%);
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    /* Ambient light */

    .light-cone {
      position: absolute;
      top: 70px;
      left: 50%;
      width: min(850px, 150vw);
      height: min(760px, 115vh);
      transform: translateX(-50%);
      background: radial-gradient(
        ellipse at 50% 10%,
        rgba(255, 215, 122, 0.27) 0%,
        rgba(255, 190, 75, 0.12) 25%,
        transparent 67%
      );
      filter: blur(14px);
      opacity: 0;
      transition: opacity 1s ease;
      z-index: -2;
      pointer-events: none;
    }

    body.lit .light-cone {
      opacity: 1;
    }

    /* Lamp */

    .lamp {
      position: absolute;
      top: 4vh;
      left: 50%;
      width: 220px;
      height: 245px;
      transform: translateX(-50%);
      z-index: 10;
    }

    .ceiling-mount {
      width: 34px;
      height: 9px;
      margin: 0 auto;
      border-radius: 8px;
      background: #292a2e;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.7);
    }

    .main-wire {
      width: 4px;
      height: 65px;
      margin: 0 auto;
      border-radius: 5px;
      background: linear-gradient(90deg, #555, #aaa, #555);
    }

    .shade {
      position: relative;
      width: 172px;
      height: 82px;
      margin: 0 auto;
      background: linear-gradient(180deg, #303136, #111216);
      clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.55));
      transition:
        background 0.7s ease,
        filter 0.7s ease;
    }

    body.lit .shade {
      background: linear-gradient(180deg, #fff0c5, #d8c59c);
      filter:
        drop-shadow(0 0 28px rgba(255, 214, 115, 0.4))
        drop-shadow(0 12px 18px rgba(0, 0, 0, 0.4));
    }

    .bulb {
      position: absolute;
      top: 112px;
      left: 50%;
      width: 37px;
      height: 43px;
      transform: translateX(-50%);
      border-radius: 50% 50% 46% 46%;
      background: #25262a;
      box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.55s ease;
    }

    body.lit .bulb {
      background: #fff6ca;
      box-shadow:
        0 0 14px #fff1a8,
        0 0 36px 12px rgba(255, 207, 88, 0.8),
        0 0 100px 36px rgba(255, 176, 44, 0.28);
    }

    /* Pull cord */

    .cord-zone {
      position: absolute;
      top: 135px;
      left: 50%;
      width: 80px;
      height: 145px;
      transform: translateX(-50%);
      cursor: grab;
      z-index: 20;
    }

    .cord-zone:active {
      cursor: grabbing;
    }

    .pull-cord {
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 92px;
      transform: translateX(-50%);
      transform-origin: top;
      border-radius: 5px;
      background: linear-gradient(90deg, #777, #f0f0f0, #777);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      transition: height 0.18s cubic-bezier(.2, .8, .2, 1);
      pointer-events: none;
    }

    .cord-handle {
      position: absolute;
      left: 50%;
      top: 84px;
      width: 24px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(135deg, #eeeeee, #8d8d8d);
      box-shadow:
        inset -3px -4px 5px rgba(0, 0, 0, 0.28),
        0 4px 8px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      transition: top 0.18s cubic-bezier(.2, .8, .2, 1);
    }

    .cord-zone.pulling .pull-cord,
    .cord-zone.pulling .cord-handle {
      transition: none;
    }

    /* Message */

    .message {
      position: absolute;
      top: 43%;
      left: 50%;
      width: 100%;
      padding: 0 20px;
      text-align: center;
      transform: translate(-50%, 35px) scale(0.82);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.16, 1, .3, 1);
    }

    body.lit .message {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .message h1 {
      margin: 0;
      font-size: clamp(42px, 11vw, 100px);
      line-height: 0.95;
      letter-spacing: 0.02em;
      font-weight: 800;
      text-shadow: 0 0 24px rgba(255, 86, 117, 0.35);
    }

    .heart {
      display: inline-block;
      color: var(--pink);
      animation: heartbeat 1.15s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(255, 71, 112, 0.5));
    }

    .message p {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 3.5vw, 20px);
      letter-spacing: 0.08em;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      14% {
        transform: scale(1.25);
      }

      28% {
        transform: scale(1);
      }

      42% {
        transform: scale(1.15);
      }
    }

    /* Floating particles */

    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      bottom: -40px;
      color: var(--pink);
      opacity: 0;
      animation: rise linear forwards;
      filter: drop-shadow(0 0 6px rgba(255, 71, 112, 0.4));
    }

    @keyframes rise {
      0% {
        opacity: 0;
        transform:
          translate3d(0, 0, 0)
          scale(0.5)
          rotate(0);
      }

      12% {
        opacity: 0.9;
      }

      100% {
        opacity: 0;
        transform:
          translate3d(var(--drift), -115vh, 0)
          scale(1.15)
          rotate(30deg);
      }
    }

    /* Floor glow */

    .floor-glow {
      position: absolute;
      left: 50%;
      bottom: -8%;
      width: min(900px, 140vw);
      height: 42%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(
        ellipse,
        rgba(255, 205, 105, 0.14),
        transparent 68%
      );
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }

    body.lit .floor-glow {
      opacity: 1;
    }

    /* Instruction */

    .instruction {
      position: absolute;
      left: 50%;
      bottom: 7vh;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      text-align: center;
      color: rgba(255, 255, 255, 0.58);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .instruction .arrow {
      display: inline-block;
      margin-right: 7px;
      animation: bounce 1.2s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(5px);
      }
    }

    @media (max-height: 650px) {
      .lamp {
        top: 2vh;
      }

      .message {
        top: 45%;
      }

      .instruction {
        bottom: 4vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <div class="light-cone"></div>
    <div class="floor-glow"></div>

    <!-- Lamp -->
    <section class="lamp" aria-label="Pull cord lamp">

      <div class="ceiling-mount"></div>

      <div class="main-wire"></div>

      <div class="shade"></div>

      <div class="bulb"></div>

      <!-- Pull this cord downward -->
      <div class="cord-zone" id="cordZone">
        <div class="pull-cord" id="pullCord"></div>
        <div class="cord-handle" id="cordHandle"></div>
      </div>

    </section>

    <!-- Message -->
    <section class="message" aria-live="polite">

      <h1>
        I <span class="heart">♥</span> YOU
      </h1>

      <p>
        You make my world brighter.
      </p>

    </section>

    <!-- Floating hearts -->
    <div class="particles" id="particles"></div>

    <!-- Instructions -->
    <div class="instruction" id="instruction">
      <span class="arrow">↓</span>
      Pull the cord down
    </div>

  </main>

  <script>

    const body = document.body;

    const cordZone =
      document.getElementById("cordZone");

    const pullCord =
      document.getElementById("pullCord");

    const cordHandle =
      document.getElementById("cordHandle");

    const instruction =
      document.getElementById("instruction");

    const particles =
      document.getElementById("particles");


    const NORMAL_LENGTH = 92;

    const MAX_PULL = 95;

    const TRIGGER_DISTANCE = 48;


    let pointerStartY = 0;

    let currentPull = 0;

    let dragging = false;

    let lightOn = false;

    let hasTriggered = false;


    /*
      Updates the visual length of the pull cord.
    */

    function setCordLength(length) {

      const clamped =
        Math.max(NORMAL_LENGTH, length);

      pullCord.style.height =
        `${clamped}px`;

      cordHandle.style.top =
        `${clamped - 8}px`;
    }


    /*
      Start dragging the cord.
    */

    function startPull(event) {

      dragging = true;

      hasTriggered = false;

      pointerStartY =
        event.clientY;

      currentPull = 0;

      cordZone.classList.add("pulling");

      if (cordZone.setPointerCapture) {
        cordZone.setPointerCapture(
          event.pointerId
        );
      }

      event.preventDefault();
    }


    /*
      Move the cord downward.
    */

    function movePull(event) {

      if (!dragging) return;

      currentPull =
        Math.max(
          0,
          event.clientY - pointerStartY
        );

      const visualPull =
        Math.min(
          currentPull,
          MAX_PULL
        );

      setCordLength(
        NORMAL_LENGTH + visualPull
      );


      /*
        When the user pulls far enough,
        toggle the lamp.
      */

      if (
        currentPull >= TRIGGER_DISTANCE &&
        !hasTriggered
      ) {

        hasTriggered = true;

        toggleLight();
      }
    }


    /*
      Release the cord.
    */

    function endPull() {

      if (!dragging) return;

      dragging = false;

      cordZone.classList.remove(
        "pulling"
      );

      /*
        The cord smoothly returns
        to its normal position.
      */

      setCordLength(
        NORMAL_LENGTH
      );
    }


    /*
      Turn the lamp on/off.
    */

    function toggleLight() {

      lightOn = !lightOn;

      body.classList.toggle(
        "lit",
        lightOn
      );


      if (lightOn) {

        instruction.innerHTML =
          '<span class="arrow">↓</span> Pull again to turn it off';

        createParticles(24);

      } else {

        instruction.innerHTML =
          '<span class="arrow">↓</span> Pull the cord down';
      }
    }


    /*
      Create floating hearts and stars.
    */

    function createParticles(count) {

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const particle =
          document.createElement("span");

        particle.className =
          "particle";

        particle.textContent =
          Math.random() > 0.18
            ? "♥"
            : "✦";


        particle.style.left =
          `${Math.random() * 100}%`;

        particle.style.fontSize =
          `${12 + Math.random() * 20}px`;

        particle.style.animationDuration =
          `${4 + Math.random() * 4}s`;

        particle.style.animationDelay =
          `${Math.random() * 1.2}s`;

        particle.style.setProperty(
          "--drift",
          `${-70 + Math.random() * 140}px`
        );


        particles.appendChild(
          particle
        );


        setTimeout(
          () => particle.remove(),
          9000
        );
      }
    }


    /*
      Pointer events:
      Works with mouse, touch and stylus.
    */

    cordZone.addEventListener(
      "pointerdown",
      startPull
    );

    cordZone.addEventListener(
      "pointermove",
      movePull
    );

    cordZone.addEventListener(
      "pointerup",
      endPull
    );

    cordZone.addEventListener(
      "pointercancel",
      endPull
    );


    /*
      Prevent the page from scrolling
      while touching the cord.
    */

    cordZone.addEventListener(
      "touchstart",
      event => event.preventDefault(),
      { passive: false }
    );


    /*
      Initial cord position.
    */

    setCordLength(
      NORMAL_LENGTH
    );

  </script>

</body>
</html>
